name: Template administration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  template:
    name: Administrative integrity (not product CI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B scripts/check_template.py
      - run: python -B -m unittest discover -s tests -v
      # Project owner must add real native platform/security gates on adoption.
